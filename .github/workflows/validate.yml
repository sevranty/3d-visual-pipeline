name: Validate repository (manual fallback)

on:
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: Upload validation JSON evidence
        required: false
        default: false
        type: boolean

concurrency:
  group: 3dp-manual-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run complete validation
        run: python3 skills/3d-visual-pipeline/scripts/validate_all.py --report-dir validation/runtime

      - name: Verify clean workspace
        if: always()
        run: |
          changes="$(git status --short)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Upload validation evidence
        if: failure() || inputs.upload_evidence
        uses: actions/upload-artifact@v4
        with:
          name: 3dp-manual-validation-${{ github.run_id }}
          path: validation/runtime/*.json
          if-no-files-found: warn
